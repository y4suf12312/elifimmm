<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🎂 İyi ki Doğdun Elif</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        html, body {
            min-height: 100vh;
            min-height: 100dvh;
            background: radial-gradient(circle at 30% 30%, #1a0b1f, #0b040e);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 12px;
            touch-action: manipulation;
        }

        #starfield {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 12px 2px rgba(255, 80, 200, 0.6);
            animation: twinkle var(--duration) infinite alternate ease-in-out;
            opacity: 0.3;
            width: var(--size);
            height: var(--size);
            top: var(--top);
            left: var(--left);
        }
        @keyframes twinkle {
            0% { opacity: 0.15; transform: scale(0.8); }
            100% { opacity: 0.9; transform: scale(1.3); }
        }

        #entry-screen {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 40% 30%, #1f0a24, #09030b);
            backdrop-filter: blur(2px);
            transition: opacity 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            padding: 20px;
            text-align: center;
            touch-action: manipulation;
            opacity: 1;
        }
        #entry-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .entry-title {
            font-size: clamp(2.8rem, 14vw, 6rem);
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ff69b4, #ffb6d9, #ff85c8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px #ff3b9f, 0 0 70px #ff3b9f;
            animation: neonPulse 2s infinite alternate;
            margin-bottom: 10px;
            pointer-events: none;
        }
        .entry-sub {
            color: rgba(255, 220, 240, 0.9);
            font-size: clamp(1rem, 3.5vw, 1.6rem);
            letter-spacing: 2px;
            font-weight: 300;
            backdrop-filter: blur(4px);
            padding: 8px 20px;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 150, 200, 0.2);
            margin-bottom: 10px;
            pointer-events: none;
        }
        .loading-dots {
            color: rgba(255, 220, 240, 0.7);
            font-size: 1.2rem;
            margin-top: 20px;
            animation: dots 1.5s infinite;
            pointer-events: none;
        }
        @keyframes dots {
            0% { content: ''; }
            33% { content: '.'; }
            66% { content: '..'; }
            100% { content: '...'; }
        }

        #main-screen {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            opacity: 0;
            transition: opacity 1.4s ease;
            padding: 8px;
            pointer-events: none;
        }
        #main-screen.fade-in {
            opacity: 1;
            pointer-events: all;
        }

        .glass-card {
            background: rgba(30, 10, 35, 0.45);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border-radius: 40px;
            padding: 24px 20px;
            border: 1px solid rgba(255, 200, 230, 0.15);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255, 80, 180, 0.1);
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 16px;
            align-items: center;
            transition: box-shadow 0.3s;
        }
        @media (max-width: 860px) {
            .glass-card {
                grid-template-columns: 1fr;
                gap: 24px;
                border-radius: 32px;
                padding: 24px 16px;
            }
        }

        .photo-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .photo {
            width: 100%;
            max-width: 280px;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 0 30px #ff3b9f88, 0 0 60px #ff3b9f44;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.3s;
            border: 2px solid rgba(255, 180, 220, 0.4);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            background: #2a0f30;
        }
        .photo:active {
            transform: scale(0.96);
        }
        @media (max-width: 860px) {
            .photo { max-width: 200px; }
        }
        @media (max-width: 480px) {
            .photo { max-width: 160px; }
        }

        .photo-error {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff69b4;
            font-size: 14px;
            text-align: center;
            background: rgba(255, 20, 120, 0.1);
            border: 2px dashed #ff3b9f;
            padding: 20px;
            width: 100%;
            max-width: 280px;
            aspect-ratio: 1/1;
            border-radius: 50%;
        }

        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 4px 0;
        }
        .neon-headline {
            font-size: clamp(1.4rem, 4.5vw, 3.2rem);
            font-weight: 700;
            background: linear-gradient(135deg, #ff8ec4, #ffb0d6, #ff6bb5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px #ff3b9f, 0 0 60px #ff3b9f55;
            letter-spacing: 1px;
            margin-bottom: 10px;
            line-height: 1.2;
        }
        .birthday-message {
            color: rgba(255, 235, 245, 0.9);
            font-size: clamp(0.9rem, 2.2vw, 1.4rem);
            font-weight: 300;
            line-height: 1.7;
            max-width: 380px;
            margin: 4px auto 12px;
            text-shadow: 0 0 20px rgba(255, 80, 180, 0.3);
            padding: 0 4px;
        }
        .birthday-message span {
            display: block;
        }

        .heart-beat {
            margin-top: 8px;
            font-size: clamp(3.2rem, 10vw, 6rem);
            display: inline-block;
            animation: heartbeat 1.3s infinite ease-in-out;
            filter: drop-shadow(0 0 30px #ff3b9faa);
            line-height: 1;
            transform-origin: center;
            touch-action: manipulation;
        }
        @keyframes heartbeat {
            0% { transform: scale(0.9); }
            15% { transform: scale(1.2); }
            30% { transform: scale(0.95); }
            45% { transform: scale(1.1); }
            70% { transform: scale(1); }
            100% { transform: scale(0.9); }
        }

        @keyframes neonPulse {
            0% { text-shadow: 0 0 20px #ff3b9f, 0 0 40px #ff3b9f55; }
            100% { text-shadow: 0 0 40px #ff6bb5, 0 0 80px #ff3b9faa, 0 0 120px #ff3b9f44; }
        }

        @media (max-width: 480px) {
            .glass-card { 
                padding: 16px 12px; 
                border-radius: 28px;
                gap: 18px;
            }
            .entry-sub {
                font-size: 0.95rem;
                padding: 6px 16px;
                margin-bottom: 24px;
            }
            .birthday-message {
                font-size: 0.85rem;
                line-height: 1.6;
            }
        }

        @media (max-width: 380px) {
            .photo { max-width: 130px; }
            .glass-card { padding: 12px 8px; gap: 14px; }
            .neon-headline { font-size: 1.2rem; }
        }

        .glow-dot {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, #ff80b0, transparent 70%);
            filter: blur(2px);
            pointer-events: none;
            z-index: 1;
            opacity: 0.25;
            width: 180px;
            height: 180px;
            animation: floatGlow 14s infinite alternate ease-in-out;
        }
        .glow-dot:nth-child(1) { top: 5%; left: 2%; }
        .glow-dot:nth-child(2) { bottom: 8%; right: 3%; width: 240px; height: 240px; opacity: 0.15; }
        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.3); }
        }

        /* MÜZİK KONTROL BUTONU */
        .music-control {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 50;
            background: rgba(255, 20, 120, 0.25);
            backdrop-filter: blur(10px);
            border: 2px solid #ff3b9f;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px #ff3b9f55;
            color: white;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .music-control:active {
            transform: scale(0.9);
        }
        .music-control:hover {
            background: rgba(255, 20, 120, 0.4);
            box-shadow: 0 0 50px #ff3b9faa;
        }
        @media (max-width: 480px) {
            .music-control {
                width: 50px;
                height: 50px;
                font-size: 22px;
                bottom: 20px;
                right: 20px;
            }
        }

        .song-title {
            color: rgba(255, 200, 230, 0.6);
            font-size: 0.8rem;
            margin-top: 4px;
            font-style: italic;
            letter-spacing: 1px;
            animation: fadeInOut 3s infinite alternate;
        }
        @keyframes fadeInOut {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="starfield"></div>
    <div class="glow-dot"></div>
    <div class="glow-dot"></div>

    <div id="entry-screen">
        <div class="entry-title">❤️ Happy Birthday ❤️</div>
        <div class="entry-sub">Elif için küçük bir sürpriz hazırlandı.</div>
        <div class="loading-dots">Yükleniyor</div>
    </div>

    <div id="main-screen">
        <div class="glass-card">
            <div class="photo-wrapper">
                <img src="sol.jpg" alt="Elif sol" class="photo" id="leftPhoto" loading="lazy"
                     onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'photo-error\'>❌ sol.jpg<br>bulunamadı</div>';">
            </div>

            <div class="center-content">
                <div class="neon-headline">❤️ İyi ki Doğdun Elif'im ❤️</div>
                <div class="birthday-message">
                    <span>İyi ki doğdun Elif'im.</span>
                    <span>İyi ki varsın.</span>
                    <span>Yeni yaşın kutlu olsun.</span>
                    <span>Gülüşün hiç eksik olmasın.</span>
                    <span>Nice güzel yaşlara... 🎂✨</span>
                </div>
                <div class="heart-beat">❤️</div>
                <div class="song-title">🎵 Canımdan Can İste</div>
            </div>

            <div class="photo-wrapper">
                <img src="sag.jpg" alt="Elif sağ" class="photo" id="rightPhoto" loading="lazy"
                     onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'photo-error\'>❌ sag.jpg<br>bulunamadı</div>';">
            </div>
        </div>
    </div>

    <!-- MÜZİK KONTROL BUTONU -->
    <div class="music-control" id="musicControl">🔇</div>

    <!-- SES DOSYASI -->
    <audio id="bgMusic" loop preload="auto">
        <source src="Tudanya-Canimdan-Can-Iste.mp3" type="audio/mpeg">
        Tarayıcınız ses dosyasını desteklemiyor.
    </audio>

    <script>
        (function() {
            // YILDIZLAR
            const starfield = document.getElementById('starfield');
            const starCount = 140;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 4 + 1.5;
                const top = Math.random() * 100;
                const left = Math.random() * 100;
                const duration = Math.random() * 5 + 3;
                star.style.setProperty('--size', size + 'px');
                star.style.setProperty('--top', top + '%');
                star.style.setProperty('--left', left + '%');
                star.style.setProperty('--duration', duration + 's');
                star.style.animationDelay = Math.random() * 4 + 's';
                starfield.appendChild(star);
            }

            // GİRİŞ GEÇİŞİ
            const entryScreen = document.getElementById('entry-screen');
            const mainScreen = document.getElementById('main-screen');

            setTimeout(function() {
                entryScreen.classList.add('fade-out');
                setTimeout(function() {
                    mainScreen.classList.add('fade-in');
                }, 100);
                setTimeout(function() {
                    entryScreen.style.display = 'none';
                }, 1000);
            }, 1500);

            window.addEventListener('load', function() {
                entryScreen.style.opacity = '1';
                entryScreen.classList.remove('fade-out');
                mainScreen.classList.remove('fade-in');
                entryScreen.style.display = 'flex';
            });

            // MÜZİK KONTROL
            const musicControl = document.getElementById('musicControl');
            const bgMusic = document.getElementById('bgMusic');
            let isMusicPlaying = false;

            function toggleMusic() {
                if (isMusicPlaying) {
                    bgMusic.pause();
                    musicControl.textContent = '🔇';
                    isMusicPlaying = false;
                    console.log('🔇 Müzik durduruldu');
                } else {
                    bgMusic.play().then(function() {
                        musicControl.textContent = '🎵';
                        isMusicPlaying = true;
                        console.log('🎵 Canımdan Can İste çalıyor...');
                    }).catch(function(error) {
                        console.log('❌ Müzik çalınamadı:', error);
                        musicControl.textContent = '🎵';
                    });
                }
            }

            musicControl.addEventListener('click', function(e) {
                e.preventDefault();
                toggleMusic();
            });

            musicControl.addEventListener('touchstart', function(e) {
                e.preventDefault();
                toggleMusic();
            }, { passive: false });

            // Otomatik başlat
            setTimeout(function() {
                bgMusic.play().then(function() {
                    musicControl.textContent = '🎵';
                    isMusicPlaying = true;
                    console.log('🎵 Canımdan Can İste otomatik başladı!');
                }).catch(function() {
                    console.log('⏸️ Otomatik başlatma engellendi, butona tıklayın.');
                    musicControl.textContent = '🎵';
                });
            }, 2500);

            // Fotoğraf kontrol
            const leftImg = document.getElementById('leftPhoto');
            const rightImg = document.getElementById('rightPhoto');

            setTimeout(function() {
                if (leftImg.naturalWidth === 0) {
                    console.log('❌ sol.jpg yüklenemedi!');
                } else {
                    console.log('✅ sol.jpg yüklendi!');
                }
                if (rightImg.naturalWidth === 0) {
                    console.log('❌ sag.jpg yüklenemedi!');
                } else {
                    console.log('✅ sag.jpg yüklendi!');
                }
            }, 2000);

            console.log('🎂 Elif doğum günü sitesi hazır!');
            console.log('🎵 Şarkı: Canımdan Can İste - Tudanya');
            console.log('📸 sol.jpg ve sag.jpg fotoğrafları yüklendi.');
        })();
    </script>
</body>
</html>
